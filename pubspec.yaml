name: owlets
description: Wallet manager and logging app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  owlet_flutter:
    path: ../owlet-flutter
  owlet_router: ^0.0.2
  cupertino_icons: ^1.0.6
  objectx: ^1.0.2
  intl: ^0.18.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  flutter_screenutil: ^5.9.0
  theme_tailor_annotation: ^2.0.2
  get_it: ^7.6.4
  injectable: ^2.3.2
  built_value: ^8.8.1
  built_collection: ^5.1.1
  formz: ^0.6.1
  dartz: ^0.10.1
  flutter_bloc: ^8.1.3
  meta: ^1.9.1
  bloc: ^8.1.2
  auto_size_text_field: ^2.2.2
  equatable: ^2.0.5
  realm: ^1.6.1
  json_annotation: ^4.8.1
  flutter_staggered_grid_view: ^0.7.0
  overlay_manager: ^0.0.2+1
  owlet_toast: ^0.0.1
  lottie: ^2.7.0
  flex_color_picker: ^3.3.0
  serializable: ^2.0.1
  rxdart: ^0.27.7
  custom_refresh_indicator: ^3.0.0
  syncfusion_flutter_datagrid: ^23.2.7
  syncfusion_flutter_core: ^23.2.7
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  owlet_lints: ^4.0.0+1
  flutter_gen_runner: ^5.3.2
  copy_with_extension_gen: ^5.0.4
  theme_tailor: ^2.0.2
  built_value_generator: ^8.8.1
  injectable_generator: ^2.4.1
  lorem_ipsum: ^0.0.3
  json_serializable: ^6.7.1

dependency_overrides:
  analyzer: ^6.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: false
  assets:
    - assets/image/
    - assets/image/icons/
    - assets/image/animations/


flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    flare_flutter: true
    rive: true
    lottie: true

  outputs:
    # Optional
    # Set to true if you want this package to be a package dependency
    # See: https://flutter.dev/docs/development/ui/assets-and-images#from-packages
    package_parameter_enabled: false
    style: dot-delimiter
    class_name: Assets
